<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品列表</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fa;
            color: #303133;
        }
        .header {
            background: #fff;
            padding: 16px 32px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 18px; }
        .header .user-info { font-size: 14px; color: #606266; }
        .header .user-info span { margin-right: 12px; }
        .header button {
            padding: 6px 16px;
            background: #f56c6c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
        .search-bar {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .form-item { display: flex; flex-direction: column; gap: 6px; }
        .form-item label { font-size: 13px; color: #606266; }
        .form-item input, .form-item select {
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            min-width: 160px;
        }
        .search-btn, .reset-btn, .add-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .search-btn { background: #409eff; color: white; }
        .reset-btn { background: #909399; color: white; }
        .add-btn { background: #67c23a; color: white; }
        table {
            width: 100%;
            background: white;
            border-radius: 8px;
            border-collapse: collapse;
            overflow: hidden;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #ebeef5;
            font-size: 14px;
        }
        th {
            background: #fafafa;
            font-weight: 500;
            color: #606266;
        }
        tr:hover { background: #f5f7fa; }
        .warning { color: #f56c6c; font-weight: 500; }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .tag-on { background: #f0f9eb; color: #67c23a; }
        .tag-off { background: #fef0f0; color: #f56c6c; }
        .pagination {
            margin-top: 16px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .pagination button {
            padding: 6px 14px;
            border: 1px solid #dcdfe6;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .pagination button.active {
            background: #409eff;
            color: white;
            border-color: #409eff;
        }
        .pagination button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .action-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 4px;
        }
        .btn-stock-in { background: #409eff; color: white; }
        .btn-stock-out { background: #e6a23c; color: white; }
        .btn-status { background: #67c23a; color: white; }
        .btn-delete { background: #f56c6c; color: white; }
        
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 8px;
            width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .modal-item { margin-bottom: 16px; }
        .modal-item label { display: block; margin-bottom: 6px; color: #606266; font-size: 14px; }
        .modal-item input, .modal-item select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-cancel { background: #909399; color: white; }
        .btn-confirm { background: #409eff; color: white; }
    </style>
</head>
<body>
    <div class="header">
        <h1>商品管理系统</h1>
        <div class="user-info">
            <span id="username-display"></span>
            <span id="role-display" style="color: #409eff;"></span>
            <button onclick="logout()">退出登录</button>
        </div>
    </div>
    <div class="container">
        <div class="search-bar">
            <div class="form-item">
                <label>商品名称</label>
                <input type="text" id="name" placeholder="请输入商品名称">
            </div>
            <div class="form-item">
                <label>分类</label>
                <select id="category">
                    <option value="">请选择分类</option>
                </select>
            </div>
            <div class="form-item">
                <label>最低价</label>
                <input type="number" id="minPrice" placeholder="最低价">
            </div>
            <div class="form-item">
                <label>最高价</label>
                <input type="number" id="maxPrice" placeholder="最高价">
            </div>
            <button class="search-btn" onclick="search()">搜索</button>
            <button class="reset-btn" onclick="reset()">重置</button>
            <button class="add-btn" id="add-btn" onclick="showAddModal()" style="display:none;">新增商品</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>商品名称</th>
                    <th>分类</th>
                    <th>价格</th>
                    <th>库存</th>
                    <th>预警库存</th>
                    <th>状态</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="product-list"></tbody>
        </table>
        <div class="pagination" id="pagination"></div>
    </div>

    <!-- 新增商品模态框 -->
    <div class="modal" id="add-modal">
        <div class="modal-content">
            <div class="modal-title">新增商品</div>
            <div class="modal-item">
                <label>商品名称</label>
                <input type="text" id="add-name" placeholder="请输入商品名称">
            </div>
            <div class="modal-item">
                <label>分类</label>
                <select id="add-category">
                    <option value="">请选择分类</option>
                    <option value="电子产品">电子产品</option>
                    <option value="食品">食品</option>
                    <option value="服装">服装</option>
                    <option value="家居">家居</option>
                    <option value="图书">图书</option>
                </select>
            </div>
            <div class="modal-item">
                <label>价格</label>
                <input type="number" id="add-price" placeholder="请输入价格">
            </div>
            <div class="modal-item">
                <label>库存</label>
                <input type="number" id="add-stock" placeholder="请输入库存">
            </div>
            <div class="modal-item">
                <label>预警库存</label>
                <input type="number" id="add-warnStock" placeholder="请输入预警库存">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeAddModal()">取消</button>
                <button class="btn-confirm" onclick="submitAdd()">确认</button>
            </div>
        </div>
    </div>

    <!-- 入库模态框 -->
    <div class="modal" id="stock-in-modal">
        <div class="modal-content">
            <div class="modal-title">入库</div>
            <div class="modal-item">
                <label>入库数量</label>
                <input type="number" id="stock-in-quantity" placeholder="请输入入库数量">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeStockInModal()">取消</button>
                <button class="btn-confirm" onclick="submitStockIn()">确认</button>
            </div>
        </div>
    </div>

    <!-- 出库模态框 -->
    <div class="modal" id="stock-out-modal">
        <div class="modal-content">
            <div class="modal-title">出库</div>
            <div class="modal-item">
                <label>出库数量</label>
                <input type="number" id="stock-out-quantity" placeholder="请输入出库数量">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeStockOutModal()">取消</button>
                <button class="btn-confirm" onclick="submitStockOut()">确认</button>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:8080';
        let currentPage = 1;
        let pageSize = 10;
        let totalPages = 1;
        let currentRole = '';
        let currentProductId = null;

        function checkLogin() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login';
                return;
            }
            currentRole = localStorage.getItem('role') || 'user';
            document.getElementById('username-display').textContent = '欢迎，' + localStorage.getItem('username');
            document.getElementById('role-display').textContent = currentRole === 'admin' ? '[管理员]' : '[普通用户]';
            
            if (currentRole === 'admin') {
                document.getElementById('add-btn').style.display = 'block';
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            localStorage.removeItem('role');
            window.location.href = '/login';
        }

        function search() {
            currentPage = 1;
            loadProducts();
        }

        function reset() {
            document.getElementById('name').value = '';
            document.getElementById('category').value = '';
            document.getElementById('minPrice').value = '';
            document.getElementById('maxPrice').value = '';
            currentPage = 1;
            loadProducts();
        }

        function loadCategories() {
            fetch(API + '/product/categories')
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('category');
                select.innerHTML = '<option value="">请选择分类</option>';
                data.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    select.appendChild(option);
                });
            })
            .catch(err => console.error(err));
        }

        function loadProducts() {
            const name = document.getElementById('name').value;
            const category = document.getElementById('category').value;
            const minPrice = document.getElementById('minPrice').value;
            const maxPrice = document.getElementById('maxPrice').value;

            let url = `${API}/product/page?current=${currentPage}&size=${pageSize}`;
            if (name) url += '&name=' + encodeURIComponent(name);
            if (category) url += '&category=' + encodeURIComponent(category);
            if (minPrice) url += '&minPrice=' + minPrice;
            if (maxPrice) url += '&maxPrice=' + maxPrice;

            fetch(url)
            .then(res => res.json())
            .then(data => {
                if (!data) return;
                renderTable(data.records || []);
                totalPages = Math.ceil((data.total || 0) / pageSize);
                renderPagination();
            })
            .catch(err => console.error(err));
        }

        function renderTable(list) {
            const tbody = document.getElementById('product-list');
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#909399;padding:40px;">暂无数据</td></tr>';
                return;
            }
            tbody.innerHTML = list.map(p => `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.productName}</td>
                    <td>${p.category}</td>
                    <td>¥${p.price}</td>
                    <td class="${p.stock <= p.warnStock ? 'warning' : ''}">${p.stock}${p.stock <= p.warnStock ? ' (预警)' : ''}</td>
                    <td>${p.warnStock}</td>
                    <td><span class="tag ${p.status === 1 ? 'tag-on' : 'tag-off'}">${p.status === 1 ? '上架' : '下架'}</span></td>
                    <td>${p.createTime ? p.createTime.substring(0, 19).replace('T', ' ') : ''}</td>
                    <td>
                        <button class="action-btn btn-stock-in" onclick="showStockInModal(${p.id})">入库</button>
                        <button class="action-btn btn-stock-out" onclick="showStockOutModal(${p.id})">出库</button>
                        ${currentRole === 'admin' ? `
                            <button class="action-btn btn-status" onclick="toggleStatus(${p.id}, ${p.status === 1 ? 0 : 1})">${p.status === 1 ? '下架' : '上架'}</button>
                            <button class="action-btn btn-delete" onclick="deleteProduct(${p.id})">删除</button>
                        ` : ''}
                    </td>
                </tr>
            `).join('');
        }

        function renderPagination() {
            const pg = document.getElementById('pagination');
            let html = `<button onclick="goPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>上一页</button>`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
            }
            html += `<button onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>下一页</button>`;
            pg.innerHTML = html;
        }

        function goPage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            loadProducts();
        }

        // 新增商品
        function showAddModal() {
            document.getElementById('add-modal').classList.add('active');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.remove('active');
            document.getElementById('add-name').value = '';
            document.getElementById('add-category').value = '';
            document.getElementById('add-price').value = '';
            document.getElementById('add-stock').value = '';
            document.getElementById('add-warnStock').value = '';
        }

        function submitAdd() {
            const name = document.getElementById('add-name').value.trim();
            const category = document.getElementById('add-category').value;
            const price = document.getElementById('add-price').value;
            const stock = document.getElementById('add-stock').value;
            const warnStock = document.getElementById('add-warnStock').value;

            if (!name || !category || !price || !stock || !warnStock) {
                alert('请填写完整信息');
                return;
            }

            fetch(API + '/product', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                body: JSON.stringify({
                    productName: name,
                    category: category,
                    price: parseFloat(price),
                    stock: parseInt(stock),
                    warnStock: parseInt(warnStock)
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    alert('新增成功');
                    closeAddModal();
                    loadProducts();
                } else {
                    alert(data.msg || '新增失败');
                }
            })
            .catch(() => alert('网络错误'));
        }

        // 入库
        function showStockInModal(id) {
            currentProductId = id;
            document.getElementById('stock-in-modal').classList.add('active');
        }

        function closeStockInModal() {
            document.getElementById('stock-in-modal').classList.remove('active');
            document.getElementById('stock-in-quantity').value = '';
            currentProductId = null;
        }

        function submitStockIn() {
            const quantity = document.getElementById('stock-in-quantity').value;
            if (!quantity || quantity <= 0) {
                alert('请输入有效的入库数量');
                return;
            }

            fetch(`${API}/product/${currentProductId}/stock-in`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                body: JSON.stringify({ quantity: parseInt(quantity) })
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    alert('入库成功');
                    closeStockInModal();
                    loadProducts();
                } else {
                    alert(data.msg || '入库失败');
                }
            })
            .catch(() => alert('网络错误'));
        }

        // 出库
        function showStockOutModal(id) {
            currentProductId = id;
            document.getElementById('stock-out-modal').classList.add('active');
        }

        function closeStockOutModal() {
            document.getElementById('stock-out-modal').classList.remove('active');
            document.getElementById('stock-out-quantity').value = '';
            currentProductId = null;
        }

        function submitStockOut() {
            const quantity = document.getElementById('stock-out-quantity').value;
            if (!quantity || quantity <= 0) {
                alert('请输入有效的出库数量');
                return;
            }

            fetch(`${API}/product/${currentProductId}/stock-out`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                body: JSON.stringify({ quantity: parseInt(quantity) })
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    alert('出库成功');
                    closeStockOutModal();
                    loadProducts();
                } else {
                    alert(data.msg || '出库失败');
                }
            })
            .catch(() => alert('网络错误'));
        }

        // 切换上下架状态
        function toggleStatus(id, newStatus) {
            fetch(`${API}/product/${id}/status`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                body: JSON.stringify({ status: newStatus })
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    alert('状态已更新');
                    loadProducts();
                } else {
                    alert(data.msg || '更新失败');
                }
            })
            .catch(() => alert('网络错误'));
        }

        // 删除商品
        function deleteProduct(id) {
            if (!confirm('确定要删除此商品吗？')) return;

            fetch(`${API}/product/${id}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                }
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    alert(data.msg || '删除成功');
                    loadProducts();
                } else {
                    alert(data.msg || '删除失败');
                }
            })
            .catch(() => alert('网络错误'));
        }

        checkLogin();
        loadCategories();
        loadProducts();
    </script>
</body>
</html>
