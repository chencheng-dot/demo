<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 360px;
        }
        h2 { text-align: center; margin-bottom: 24px; color: #303133; }
        .form-item { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: #606266; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #409eff; }
        button {
            width: 100%;
            padding: 10px;
            background: #409eff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { background: #66b1ff; }
        .msg { text-align: center; margin-top: 12px; font-size: 13px; color: #909399; }
        .msg a { color: #409eff; text-decoration: none; }
        .error { color: #f56c6c; font-size: 13px; margin-top: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>用户登录</h2>
        <div class="form-item">
            <label>用户名</label>
            <input type="text" id="username" placeholder="请输入用户名">
        </div>
        <div class="form-item">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>
        <button onclick="login()">登录</button>
        <div id="error" class="error"></div>
        <div class="msg">还没有账号？<a href="register.html">去注册</a></div>
        <div class="msg" style="margin-top:8px;">管理员: admin / admin123</div>
    </div>
    <script>
        const API = 'http://localhost:8080';

        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }
            fetch(API + '/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', username);
                    window.location.href = 'products.html';
                } else {
                    showError(data.msg);
                }
            })
            .catch(() => showError('网络错误，请检查后端是否启动'));
        }

        function showError(msg) {
            document.getElementById('error').textContent = msg;
        }
    </script>
</body>
</html>
